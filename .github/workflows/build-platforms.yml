name: Build and release platform artifacts

# 构建产物发布到 GitHub Release，各平台从 Release 下载部署，不在主仓库存储产物。

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "platform/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Build artifacts
        run: node scripts/build.mjs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platform-latest
          name: Platform artifacts (latest)
          draft: false
          prerelease: false
          files: |
            api/proxy.js
            netlify/edge-functions/proxy.js
            deno/main.js
            supabase/functions/proxy/index.js
