name: Deploy Supabase

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        run: |
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o index.js \
            "https://github.com/${{ github.repository }}/releases/download/platform-latest/index.js"
          mkdir -p supabase/functions/proxy
          mv index.js supabase/functions/proxy/index.js

      - name: Deploy to Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy proxy --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
