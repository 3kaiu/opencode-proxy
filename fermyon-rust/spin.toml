spin_manifest_version = 2

[application]
name = "oc-fermyon-1"
version = "2.3.0"
description = "opencode-proxy Fermyon edge platform endpoint"
authors = ["3kaiu"]

[[trigger.http]]
route = "/..."
component = "opencode-proxy"

[component.opencode-proxy]
source = "target/wasm32-wasip1/release/opencode_proxy.wasm"
allowed_outbound_hosts = ["https://opencode.ai", "https://api.ipify.org", "https://api6.ipify.org"]

[component.opencode-proxy.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
