spin_manifest_version = 2

[application]
name = "opencode-proxy"
version = "1.0.0"
description = "HTTP proxy to opencode.ai/zen/v1 - Fermyon Cloud (Rust)"
authors = ["3kaiu"]

[[trigger.http]]
route = "/..."
component = "opencode-proxy"

[component.opencode-proxy]
source = "target/wasm32-wasip1/release/opencode_proxy.wasm"
allowed_outbound_hosts = ["https://opencode.ai"]

[component.opencode-proxy.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
